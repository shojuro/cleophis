[package]
name = "cleophis"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ureq = { version = "2", features = ["json"] }
# Same URL parser ureq resolves the download host with — used by
# download_host_allowed so the allowlist can't diverge from where the
# request actually connects (WHATWG delimiter handling: ? # \ etc.).
url = "2"
tokio = { version = "1", features = ["time"] }
keyring = { version = "3", features = ["windows-native", "linux-native"] }
sha2 = "0.10"
tauri-plugin-opener = "2"
# §3a A2: native file picker for the personal-pack builder (A3's
# `window.__TAURI__.dialog.open`); this crate is Rust-only glue, no FE here.
tauri-plugin-dialog = "2"
# K9: the on-device knowledge-pack core + its real embedder backend. Pulling
# in `kpack-embed` with `features = ["real"]` here (not just `kpack-core`)
# is deliberate — the shipping app carries the real bge-base-en-v1.5
# embedder, not a mock, so the APP build requires the native llama.cpp
# toolchain (libclang + cmake) exactly like `kpack-embed`'s own doc comment
# says it must for any consumer that turns this feature on.
kpack-core = { path = "../crates/kpack-core" }
kpack-embed = { path = "../crates/kpack-embed", features = ["real"] }
# §3b B3: PDF text extraction for the pack builder. A normal dep — no
# feature/toolchain needed to compile; it binds pdfium.dll at runtime (see
# `kpack-pdf`'s module doc comment) rather than linking it in.
kpack-pdf = { path = "../crates/kpack-pdf" }

[target."cfg(windows)".dependencies]
nvml-wrapper = "0.10"
winreg = "0.52"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
