[package]
name = "cleophis"
version = "0.1.0"
edition = "2021"

[lib]
name = "cleophis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ureq = { version = "2", features = ["json"] }
# Same URL parser ureq resolves the download host with — used by
# download_host_allowed so the allowlist can't diverge from where the
# request actually connects (WHATWG delimiter handling: ? # \ etc.).
url = "2"
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
tauri-plugin-opener = "2"
# §3a A2: native file picker for the personal-pack builder (A3's
# `window.__TAURI__.dialog.open`); this crate is Rust-only glue, no FE here.
tauri-plugin-dialog = "2"
# K9: the on-device knowledge-pack core + its real embedder backend. Pulling
# in `kpack-embed` with `features = ["real"]` here (not just `kpack-core`)
# is deliberate — the shipping app carries the real bge-base-en-v1.5
# embedder, not a mock, so the APP build requires the native llama.cpp
# toolchain (libclang + cmake) exactly like `kpack-embed`'s own doc comment
# says it must for any consumer that turns this feature on.
kpack-core = { path = "../crates/kpack-core" }
kpack-embed = { path = "../crates/kpack-embed", features = ["real"] }
# §3b B3: PDF text extraction for the pack builder. A normal dep — no
# feature/toolchain needed to compile; it binds pdfium.dll at runtime (see
# `kpack-pdf`'s module doc comment) rather than linking it in.
kpack-pdf = { path = "../crates/kpack-pdf" }
# Task 4: the calc() Tauri command wraps this pure, dependency-free
# evaluator (crates/kpack-calc) — see calc.rs's module doc comment.
kpack-calc = { path = "../crates/kpack-calc" }
# B1 (adapter-distribution milestone): the signed distribution catalog
# (`catalog_dist.rs`) verifies `catalog.json` against a compiled-in curator
# `VerifyingKey` by reusing `kpack_core::sign::verify_detached`. That
# function's signature is expressed in terms of `ed25519_dalek::VerifyingKey`
# (kpack-core's own EXACT `=2.2.0` pin — see that crate's Cargo.toml), so this
# crate needs the identical exact pin to name the same type; Cargo's
# workspace resolver already unifies both to one entry in the lock file, so
# this adds zero new versions to the dependency graph.
ed25519-dalek = "=2.2.0"
# §7 S7-1: the local conversation store (folders/chats/messages + fts5
# search) in convstore.rs. Same exact version pin as kpack-core's rusqlite
# dep (`bundled` compiles SQLite from source and ships FTS5) — already a
# transitive dependency via kpack-core, so this adds zero new crates to the
# resolved graph, it only makes an already-present version a direct,
# named dependency (same rationale as kpack-core's own sha2 pin comment).
rusqlite = { version = "0.40.1", features = ["bundled"] }
# §7 S7-1: local ISO-8601 `+TZ` timestamps for chats/messages
# (`convstore::now_iso`). `clock` is the only feature needed — this reads
# the system clock, nothing more.
chrono = { version = "0.4", features = ["clock"] }
# Offline-auth: Argon2id password verifier (cloud/verifier.rs). PHC-string
# API only — no extra features needed beyond the default `password-hash`.
argon2 = "0.5"
# argon2's `password-hash` re-export doesn't turn on rand_core's
# `getrandom` feature by default, so `OsRng` isn't reachable through it —
# pull rand_core in directly with that feature for `SaltString::generate`.
rand_core = { version = "0.6", features = ["getrandom"] }
# Offline-auth: NFC normalization so a password typed with a precomposed
# vs. combining-accent form still verifies (verifier::normalize_password).
unicode-normalization = "0.1"
# Offline-auth: zxcvbn password-strength estimator (cloud/strength.rs). Gates
# enrollment (Task 4) so a weak password can't get an offline verifier
# derived from it — offline sign-in has no server-side rate limiting to fall
# back on, so the verifier itself has to resist brute force.
zxcvbn = "3"

[target."cfg(windows)".dependencies]
nvml-wrapper = "0.10"
winreg = "0.52"

# Everywhere EXCEPT Android. Phase 3.1: `keyring` v3 falls back to its `mock`
# store on any target it has no native backend for, and Android is one — its
# `pub use mock as default` arm is `cfg(not(any(linux, freebsd, openbsd, macos,
# ios, windows)))`, and `target_os = "android"` matches none of those, so
# neither `linux-native` nor `windows-native` applies. The mock's own builder
# declares `CredentialPersistence::EntryOnly` and constructs a FRESH
# `MockCredential` per `Entry::new`, so on Android `set_password` returns `Ok`
# into a value that is dropped on the next line and `get_password` can only
# ever be `NoEntry`. A credential store that reports success and keeps nothing
# is exactly the silent-failure shape this milestone keeps cataloguing, so the
# crate is removed from the Android graph entirely rather than left to lie:
# `cloud/secure_store.rs` owns the seam, and 3.2 puts AndroidKeyStore behind it.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "linux-native"] }

# Android-only. The desktop app runs llama.cpp as a sidecar process; mobile
# cannot, so it moves inference in-process via kpack-engine's real llama.cpp
# backend. Gated to the Android target so the DESKTOP graph never pulls a second
# native llama.cpp build (kpack-embed already carries the shared one) — the
# inference.rs cfg seam re-exports engine_inproc.rs only under cfg(mobile)
# (Phase 1.1), and desktop behavior stays byte-identical. `jni` is the bridge to
# the Kotlin AndroidKeyStore SecureStore (Phase 3); declared here so it never
# enters the desktop dependency graph.
[target.'cfg(target_os = "android")'.dependencies]
kpack-engine = { path = "../crates/kpack-engine", features = ["real"] }
jni = "0.21"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
