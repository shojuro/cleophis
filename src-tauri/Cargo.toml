[package]
name = "cleophis"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["time"] }

[target."cfg(windows)".dependencies]
nvml-wrapper = "0.10"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
