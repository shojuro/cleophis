[advisories]
# RUSTSEC-2026-0459 (CVE-2026-119375, SQLite < 3.54 can return uninitialized page-cache
# memory when a database is opened with a sibling `-wal` file a less-trusted party wrote).
# Every database here is app-private and the signed packs ship without WAL siblings, so the
# exposure is low; the fix (libsqlite3-sys 0.39 = SQLite 3.54) changes the bytes of the
# curator-signed, pinned triage pack (kpack-cli reference_pack test). Lift this entry once
# the pack is rebuilt and re-signed on SQLite >= 3.54 — see
# docs/superpowers/deps-advisories-2026-11.md (Task 3 of the plan).
ignore = ["RUSTSEC-2026-0459"]
