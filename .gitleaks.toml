# gitleaks config for cleophis. Used by .github/workflows/security.yml.
# Default rules plus this project's key formats. Allowlists are narrow (one rule,
# named paths or exact values); each covers false positives classified on
# 2026-10-04 over the full history.
title = "cleophis"

[extend]
useDefault = true

[[rules]]
id = "backblaze-b2-application-key"
description = "Backblaze B2 application key: K + 3 digits + 27 base64 chars"
regex = '''(?:^|[^A-Za-z0-9+/])(K[0-9]{3}[A-Za-z0-9+/]{27})(?:[^A-Za-z0-9+/=]|$)'''
secretGroup = 1
keywords = ["k0"]

[[rules]]
id = "runpod-api-key"
description = "RunPod API key"
regex = '''\b(rpa_[A-Za-z0-9]{40,})\b'''
secretGroup = 1
keywords = ["rpa_"]

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek API key"
regex = '''\b(sk-[0-9a-f]{32})\b'''
secretGroup = 1
keywords = ["sk-"]

[[allowlists]]
description = "generic-api-key false positives (2026-10-04 full-history classification): tokenizer_vocab_sha256 in the reference build titles; NHS topic slugs containing 'api' in the cluster map"
targetRules = ["generic-api-key"]
paths = [
  '''^tools/reference/build/titles\.json$''',
  '''^tools/reference/reference-clusters\.json$''',
]

[[allowlists]]
description = "cfg(test) fixture passwords in session.rs (local mock-server tests, line 1304+): allowlisted by exact value, not by file"
targetRules = ["generic-api-key"]
paths = ['''^src-tauri/src/cloud/session\.rs$''']
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^wintergreen-diesel-canyon-42$''',
  '''^granite-orchard-plume-82$''',
  '''^cobalt-meridian-thistle-93$''',
  '''^obsidian-ledger-mosaic-37$''',
]

[[allowlists]]
description = "synthetic B2/DeepSeek-shaped test strings quoted in the ci-basic plan (Step 4 positives for the custom rules): this one file, these exact values"
targetRules = ["backblaze-b2-application-key", "deepseek-api-key", "generic-api-key"]
paths = ['''^docs/superpowers/plans/2026-10-05-ci-basic\.md$''']
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^K0011AbCdEfGhIjKlMnOpQrStUvWx/\+$''',
  '''^sk-0123456789abcdef0123456789abcdef$''',
]
