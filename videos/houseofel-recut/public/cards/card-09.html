<div class="card" data-card-id="card-09">
  <style>
    .card[data-card-id="card-09"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    /* ---- liquid glass slab ---- */
    .card[data-card-id="card-09"] .panel {
      position: absolute;
      left: 500px;
      top: 800px;
      width: 920px;
      height: 210px;
      border-radius: 34px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding: 40px 44px;
      box-sizing: border-box;
      /* refraction: thick blur + saturation lift, like glass over the scene */
      -webkit-backdrop-filter: blur(30px) saturate(2.1) brightness(1.02) contrast(1.06);
      backdrop-filter: blur(30px) saturate(2.1) brightness(1.02) contrast(1.06);
      /* SMOKED glass, not clear: the clip cuts to bright article screenshots and
         a bright warm-lit wall, and clear glass dropped white type to 2.6:1
         there. A dark tint keeps the refractive character while holding
         contrast over both bright and dark footage. */
      background: linear-gradient(
        135deg,
        rgba(20, 26, 42, 0.54) 0%,
        rgba(10, 14, 24, 0.42) 42%,
        rgba(16, 22, 42, 0.48) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow:
        0 30px 70px rgba(4, 6, 14, 0.5),
        0 8px 20px rgba(4, 6, 14, 0.34),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.78),
        inset 0 3px 14px rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(255, 255, 255, 0.14),
        inset 0 0 52px rgba(160, 190, 255, 0.1);
    }
    /* specular sweep — the highlight that sells thickness */
    .card[data-card-id="card-09"] .sheen {
      position: absolute;
      left: -30%;
      top: -60%;
      width: 90%;
      height: 220%;
      transform: rotate(18deg);
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.18) 45%,
        rgba(255, 255, 255, 0.26) 55%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
    }
    /* refractive inner rim with a faint cool fringe */
    .card[data-card-id="card-09"] .rim {
      position: absolute;
      inset: 3px;
      border-radius: 31px;
      border: 1px solid rgba(190, 214, 255, 0.28);
      box-shadow: inset 0 0 22px rgba(140, 180, 255, 0.14);
      pointer-events: none;
    }
    .card[data-card-id="card-09"] .accent {
      position: relative;
      height: 8px;
      width: 0;
      border-radius: 4px;
      background: var(--accent-3);
      box-shadow: 0 0 22px var(--accent-3);
    }
    .card[data-card-id="card-09"] .emph {
      position: relative;
      margin: 0;
      font: 800 76px/1.08 'Inter', ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -0.012em;
      text-transform: uppercase;
      text-align: center;
      color: #ffffff;
      text-shadow:
        0 2px 18px rgba(8, 12, 24, 0.75),
        0 1px 2px rgba(8, 12, 24, 0.6);
    }
    .card[data-card-id="card-09"] .emph .char {
      display: inline-block;
      margin-right: 0.22em;
    }
  </style>

  <div class="root">
    <div class="panel" id="card-09-panel">
      <div class="sheen" data-layout-allow-overflow="true"></div>
      <div class="rim"></div>
      <div
        class="accent"
        id="card-09-accent"
        data-anim="grow-x"
        data-anim-at="0.16"
        data-anim-duration="0.6"
        data-anim-target-w="300"
      ></div>
      <h2
        class="emph"
        id="card-09-emph"
        data-anim="kinetic-chars"
        data-anim-at="0.26"
        data-anim-duration="0.52"
        data-anim-stagger="0.055"
        data-anim-pattern="pop"
      >
            <span class="char">319</span>
            <span class="char">KNOWLEDGE</span>
            <span class="char">WORKERS</span>
      </h2>
    </div>
  </div>
</div>
