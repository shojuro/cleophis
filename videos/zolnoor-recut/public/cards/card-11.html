<div class="card" data-card-id="card-11">
  <style>
    .card[data-card-id="card-11"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    /* The source footage carries a permanent burned-in disclaimer at
       y≈1230–1590. The emphasis band sits ABOVE it and the scrim fades out
       before it, so the speaker's own caption is never occluded. */
    .card[data-card-id="card-11"] .scrim {
      position: absolute;
      left: 0;
      right: 0;
      top: 600px;
      height: 620px;
      background: linear-gradient(
        to bottom,
        rgba(6, 5, 16, 0) 0%,
        rgba(6, 5, 16, 0.82) 26%,
        rgba(6, 5, 16, 0.86) 82%,
        rgba(6, 5, 16, 0) 100%
      );
    }
    .card[data-card-id="card-11"] .block {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 760px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }
    .card[data-card-id="card-11"] .rule {
      height: 10px;
      width: 0;
      border-radius: 5px;
      background: var(--accent-0);
      box-shadow: 0 0 26px var(--accent-0);
    }
    .card[data-card-id="card-11"] .emph {
      margin: 0;
      font: 800 108px/1.06 'Inter', ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #f7f5ff;
      text-shadow:
        0 6px 44px rgba(6, 5, 16, 0.95),
        0 0 70px rgba(6, 5, 16, 0.8);
    }
    .card[data-card-id="card-11"] .emph .char {
      display: inline-block;
      margin-right: 0.24em;
    }
  </style>

  <div class="root">
    <div class="scrim"></div>
    <div class="block">
      <div
        class="rule"
        id="card-11-rule"
        data-anim="grow-x"
        data-anim-at="0.10"
        data-anim-duration="0.55"
        data-anim-target-w="360"
      ></div>
      <h2
        class="emph"
        id="card-11-emph"
        data-anim="kinetic-chars"
        data-anim-at="0.22"
        data-anim-duration="0.5"
        data-anim-stagger="0.06"
        data-anim-pattern="pop"
      >
          <span class="char">WHO'S</span>
          <span class="char">GOING</span>
          <span class="char">TO</span>
          <span class="char">ENFORCE</span>
          <span class="char">IT?</span>
      </h2>
    </div>
  </div>
</div>
