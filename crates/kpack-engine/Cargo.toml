[package]
name = "kpack-engine"
version = "0.1.0"
edition = "2021"
description = "In-process inference engine (EngineBackend trait + llama-cpp-2 backend) for Cleophis mobile."
publish = false

# STANDALONE during the P0 spike. This empty [workspace] table detaches the
# crate from the root Cleophis workspace, so the spike never edits the shared
# root Cargo.toml `members` list — workspace membership (and the shared
# `llama-cpp-2` pin) is a founder-gated change per the P0 brief, merged through
# main first and rebased in, never carried as local divergence. Fold this into
# the workspace at gate time by deleting this table and adding the crate to
# root `members`.
[workspace]

[dependencies]
# Streaming sha256 for the load-time integrity gate (adapter::VerifyCache),
# same crate/version family inference.rs uses.
sha2 = "0.10"

# The real linked backend. EXACT pin `=0.1.151` — the SAME version kpack-embed
# pins for the BGE embedder, confirmed (hour-one check) to expose everything the
# engine needs: generation (LlamaContext::decode + LlamaBatch + LlamaSampler),
# multi-LoRA (LlamaModel::lora_adapter_init -> LlamaContext::lora_adapter_set),
# and chat templates (LlamaModel::chat_template + apply_chat_template). One
# workspace, one version, one native backend — no pin move, so no embedder
# revalidation (spec H15 resolves to a no-op).
llama-cpp-2 = { version = "=0.1.151", optional = true }

[features]
# Default build is mock-only and toolchain-free (no cmake/libclang), exactly
# like kpack-embed: `cargo test` stays green on a machine with no native LLVM.
default = []
# The real llama.cpp-backed backend. Needs libclang + cmake at build time.
real = ["dep:llama-cpp-2"]
