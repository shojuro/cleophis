[package]
name = "kpack-cli"
version = "0.1.0"
edition = "2021"

# Phase 1h Task M4b: the offline pack-building CLI (`build-reference`,
# `verify`). A plain binary: no Tauri, no network, no embedder, no LLM. It
# builds the bundled, lexical-only NHS reference pack from the committed
# corpus and writes the two contract files the triage repo consumes
# (`chunks.jsonl`, `titles.json`). Never depends on kpack-core's `test-util`
# feature (the mock embedder is test-only).
[dependencies]
kpack-core = { path = "../kpack-core" }
# EXACT pins to the versions already in the workspace lockfile (src-tauri's),
# so this crate adds no new crate to the resolved graph.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
# `lookup --curator-key HEX` builds the verifying key for `mount_lexical`
# (M5b addendum); the built-pack tests also sign with a throwaway key. Same
# exact pin as kpack-core's.
ed25519-dalek = "=2.2.0"

[dev-dependencies]
# Turns a test-built pack into a schema-v1 pack (no titles table) for the
# `lookup` "unavailable" test. Same version and features as kpack-core's.
rusqlite = { version = "0.40.1", features = ["bundled"] }
