[package]
name = "kpack-embed"
version = "0.1.0"
edition = "2021"

# The concrete linked `Embedder` implementation (llama.cpp via `llama-cpp-2`,
# loading the bundled BGE GGUF in embedding mode) lands in K4. Kept out of
# `kpack-core` so the format core stays dependency-light and the native build
# toolchain (cmake/cc) is contained to this crate.
[dependencies]
kpack-core = { path = "../kpack-core" }
# EXACT pin (`=0.1.151`, the latest published version as of this task —
# confirmed via crates.io's API, not assumed from memory): this crate wraps
# llama.cpp via `bindgen` + a `cmake`-built native static lib. llama-cpp-2
# does not follow semver meaningfully (upstream's own README says so) and
# moves fast; an ordinary `cargo update` silently picking up a newer 0.1.x
# could change the pooling/embeddings API surface this file depends on
# (`LlamaContextParams::with_pooling_type`, `LlamaPoolingType::Cls`,
# `LlamaContext::embeddings_seq_ith`) out from under it. Bumping this pin is
# a deliberate, re-verified event, not a side effect.
llama-cpp-2 = { version = "=0.1.151", optional = true }

[features]
# The real linked embedder (K4b) needs libclang + cmake to build llama.cpp.
# Kept behind a feature so the DEFAULT workspace build needs no native
# toolchain (CI/core-dev stay green without LLVM); src-tauri turns on `real`
# for the shipping app, and K4b's impl lives under `#[cfg(feature = "real")]`.
real = ["dep:llama-cpp-2"]
