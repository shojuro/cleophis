# Secret scan and dependency audits for cleophis. NON-BLOCKING for now
# (job-level continue-on-error): findings go to the job log and summary.
# Spec: docs/superpowers/specs/2026-10-05-ci-basic-design.md §6.2.
name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (sha256-verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request) range="${BASE_SHA}..${HEAD_SHA}" ;;
            push)
              if [ "$BEFORE" = "$zero" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                range="-1 ${AFTER}"
              else
                range="${BEFORE}..${AFTER}"
              fi ;;
            *) range="--all" ;;
          esac
          echo "gitleaks range: ${range}"
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --log-opts="${range}" --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .
      - name: Findings summary
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/gitleaks.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              found = json.load(open(sys.argv[1]))
          except (FileNotFoundError, json.JSONDecodeError):
              print("## gitleaks\n\nNo report: the scan did not complete.")
              sys.exit(0)
          print(f"## gitleaks: {len(found)} finding(s) (values redacted)\n")
          if found:
              print("| rule | file | line | commit |\n|---|---|---:|---|")
              for f in found:
                  print(f"| {f.get('RuleID')} | {f.get('File')} | {f.get('StartLine')} | {str(f.get('Commit'))[:7]} |")
          PY

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.2'
      - name: npm audit (root)
        run: npm audit --package-lock-only --audit-level=high
      - name: npm audit (tools/covers)
        if: always()
        working-directory: tools/covers
        run: npm audit --package-lock-only --audit-level=high

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install pip-audit 2.10.1
        run: python -m pip install pip-audit==2.10.1
      - name: pip-audit (tools/pipeline)
        run: pip-audit -r tools/pipeline/requirements.txt

  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit 0.22.2 (sha256-verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/cargo-audit.tgz" "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP" --strip-components=1 cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit
      - name: cargo audit (workspace lock)
        run: |
          "$RUNNER_TEMP/cargo-audit" audit -f Cargo.lock
      - name: cargo audit (crates/kpack-engine lock)
        if: always()
        run: |
          "$RUNNER_TEMP/cargo-audit" audit -f crates/kpack-engine/Cargo.lock
