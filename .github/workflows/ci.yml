# CI for cleophis: the webview/probe suite on every PR into main and every push
# to main. Spec: docs/superpowers/specs/2026-10-05-ci-basic-design.md.
# Public repo: no secrets, read-only token, SHA-pinned actions.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19.2'
      # No npm install: the suite imports nothing from node_modules (measured
      # 2026-10-05 on a clean clone, 1211/1211).
      - name: node tests (src, probes)
        run: tools/run-node-tests.sh src probes
